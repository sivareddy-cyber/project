[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf_mentor"
version = "0.1.0"
description = "AI CTF Mentor/Copilot - Phase 5B persistence foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "aiosqlite>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
